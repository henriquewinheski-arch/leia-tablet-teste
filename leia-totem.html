<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LÉIA · Check-in de visita</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #1a0b4d;
    --bg2: #4b19d6;
    --card: rgba(255,255,255,.06);
    --line: rgba(255,255,255,.14);
    --text: #ffffff;
    --muted: rgba(255,255,255,.7);
    --accent: #ffa94d;
    --pink: #e86fd0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg1: #12083a; --bg2: #3d12b8; }
  }
  :root[data-theme="dark"] { --bg1: #12083a; --bg2: #3d12b8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(170deg, var(--bg1) 0%, var(--bg2) 100%);
    background-color: #1a0b4d;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 18px 14px;
    overflow: hidden;
    user-select: none;
  }
  .top {
    position: relative; width: calc(100% + 36px); margin: 0 -18px; padding: 16px 18px;
    display: flex; justify-content: center; align-items: center;
    background: #0f1340; border-bottom: 1px solid var(--line);
  }
  .logo { height: 30px; width: auto; display: block; }
  .tag { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: var(--accent); color: #3a1c00; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .card {
    width: 100%; max-width: 520px; flex: 1; min-height: 0;
    margin-top: 10px; padding: 14px 16px 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 26px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .title { margin: 0; text-align: center; font-size: 16px; font-weight: 500; line-height: 1.35; color: var(--text); }

  /* ---------- SCANNER ---------- */
  .scanner {
    position: relative;
    height: min(34vh, 300px);
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    overflow: hidden;
    background: #0b0720;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .scanner video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .scanner .shade {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 50%, transparent 38%, rgba(8,4,28,.55) 100%);
  }
  .frame { position: absolute; inset: 16%; pointer-events: none; }
  .c { position: absolute; width: 30px; height: 30px; border: 4px solid var(--accent); }
  .tl { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
  .tr { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 14px; }
  .bl { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 14px; }
  .br { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; }
  .scanline {
    position: absolute; left: 4px; right: 4px; top: 0; height: 56px;
    background: linear-gradient(180deg, transparent 0%, rgba(255,169,77,.0) 0%, rgba(255,169,77,.28) 85%, rgba(255,169,77,.9) 100%);
    border-bottom: 3px solid var(--accent);
    box-shadow: 0 6px 18px rgba(255,169,77,.55);
    animation: scan 2.2s ease-in-out infinite;
  }
  @keyframes scan {
    0%   { transform: translateY(-56px); opacity: 0; }
    12%  { opacity: 1; }
    88%  { opacity: 1; }
    100% { transform: translateY(calc(var(--h, 220px))); opacity: 0; }
  }
  .hint {
    position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
    font-size: 12px; font-weight: 500; color: var(--text); text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  .nocam {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 20px; font-size: 13px; color: var(--muted);
  }

  /* ---------- AÇÕES + CÓDIGO ---------- */
  .ghost {
    width: 100%; max-width: 380px; padding: 10px; font: inherit; font-size: 15px; font-weight: 600;
    color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 14px; cursor: pointer;
  }
  .or { font-size: 13px; color: var(--muted); margin: 0; }
  .display {
    width: 100%; max-width: 380px; text-align: center;
    font-size: 30px; font-weight: 500; letter-spacing: .18em; padding: 6px 10px;
    background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 14px;
    font-variant-numeric: tabular-nums;
  }
  .display .ph { color: rgba(255,255,255,.3); }
  .keypad {
    width: 100%; max-width: 380px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .keypad button {
    height: clamp(42px, 6.2vh, 54px);
    font: inherit; font-size: 22px; font-weight: 600; color: var(--text);
    background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 14px; cursor: pointer;
    transition: transform .06s, background .12s;
  }
  .keypad button:active { transform: scale(.95); background: rgba(255,255,255,.2); }
  .keypad .clr { color: var(--accent); }
  .confirm {
    width: 100%; max-width: 380px; padding: 13px; font: inherit; font-size: 18px; font-weight: 600;
    color: #fff; background: linear-gradient(90deg, #ff7ad9, #e86fd0); border: 0; border-radius: 16px; cursor: pointer;
    opacity: .55; transition: opacity .15s;
  }
  .confirm.ready { opacity: 1; }
  .foot { margin: 0; font-size: 11px; color: var(--muted); text-align: center; }
  .toast {
    position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%) translateY(20px);
    background: #fff; color: #1a0b4d; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px;
    opacity: 0; transition: all .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { .scanline { animation-duration: 6s; } }

  /* ---------- TELA DE VÍDEOS (inicial) ---------- */
  #attract { position: fixed; inset: 0; z-index: 50; background: #0b0720; cursor: pointer; }
  #attract.hide { display: none; }
  #attract video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #attract .cta {
    position: absolute; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    padding: 16px 30px; border-radius: 999px; font-size: 20px; font-weight: 600; color: #fff;
    background: rgba(45,8,93,.78); border: 1px solid rgba(226,208,250,.35);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } }
  @media (prefers-reduced-motion: reduce) { #attract .cta { animation: none; } }
</style>
</head>

<script>
(function () {
  var code = '';
  var MAX = 6;
  var display = document.getElementById('display');
  var confirmBtn = document.getElementById('confirm');
  var toast = document.getElementById('toast');

  function fmt() {
    var out = '';
    for (var i = 0; i < MAX; i++) {
      var ch = code[i];
      out += ch ? ch : '<span class="ph">0</span>';
      if (i === 2) out += ' ';
    }
    display.innerHTML = out;
    confirmBtn.classList.toggle('ready', code.length === MAX);
  }

  function say(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }

  var keys = ['1','2','3','4','5','6','7','8','9','C','0','⌫'];
  var pad = document.getElementById('keypad');
  keys.forEach(function (k) {
    var b = document.createElement('button');
    b.textContent = k;
    if (k === 'C') b.className = 'clr';
    b.addEventListener('click', function () {
      if (k === 'C') code = '';
      else if (k === '⌫') code = code.slice(0, -1);
      else if (code.length < MAX) code += k;
      fmt();
    });
    pad.appendChild(b);
  });

  confirmBtn.addEventListener('click', function () {
    if (code.length < MAX) { say('Digite os 6 dígitos do código'); return; }
    say('Código ' + code.slice(0,3) + ' ' + code.slice(3) + ' enviado');
    // TODO: integrar com a validação do código de visita
  });
  document.getElementById('noCode').addEventListener('click', function () {
    say('Chamando a recepção…');
    // TODO: fluxo "Não tenho código"
  });

  // altura da faixa descendo acompanha o tamanho do quadrado
  function sizeScan() {
    var f = document.getElementById('frame');
    f.style.setProperty('--h', (f.clientHeight - 56) + 'px');
  }
  window.addEventListener('resize', sizeScan);
  sizeScan();

  // ---------- vídeos ----------
  // Os vídeos ficam na mesma pasta deste arquivo no repositório.
  var VIDEOS = [
    'gemini_generated_video_1c148f85 (1).mp4',
    'gemini_generated_video_2a3a85cd (1).mp4',
    'gemini_generated_video_5abf6780 (1).mp4',
    'gemini_generated_video_936e8b98 (1).mp4'
  ];
  var IDLE_MS = 45000; // sem toque por 45 s volta para os vídeos
  var vid = document.getElementById('vid');
  var attract = document.getElementById('attract');
  var idx = 0, idleTimer = null;

  function playNext() {
    vid.src = encodeURI(VIDEOS[idx]);
    idx = (idx + 1) % VIDEOS.length;
    var p = vid.play();
    if (p && p.catch) p.catch(function () {});
  }
  vid.addEventListener('ended', playNext);
  vid.addEventListener('error', function () { setTimeout(playNext, 500); });

  // ---------- câmera + leitura de QR ----------
  var stream = null, detTimer = null;
  var video = document.getElementById('cam');
  function startCam() {
    document.getElementById('nocam').style.display = 'none';
    try {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
        .then(function (s) {
          stream = s;
          video.srcObject = s;
          if ('BarcodeDetector' in window) {
            var det = new BarcodeDetector({ formats: ['qr_code'] });
            detTimer = setInterval(function () {
              det.detect(video).then(function (r) {
                if (r && r.length) { say('QR lido com sucesso'); /* TODO: r[0].rawValue */ }
              }).catch(function () {});
            }, 400);
          }
        })
        .catch(function () { document.getElementById('nocam').style.display = 'flex'; });
    } catch (e) {
      document.getElementById('nocam').style.display = 'flex';
    }
  }
  function stopCam() {
    if (detTimer) { clearInterval(detTimer); detTimer = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.srcObject = null;
  }

  // ---------- navegação ----------
  function resetIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(showAttract, IDLE_MS);
  }
  function showCheckin() {
    attract.classList.add('hide');
    vid.pause();
    startCam();
    sizeScan();
    resetIdle();
  }
  function showAttract() {
    clearTimeout(idleTimer);
    stopCam();
    code = ''; fmt();
    attract.classList.remove('hide');
    playNext();
  }
  attract.addEventListener('click', showCheckin);
  ['pointerdown', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, function () {
      if (attract.classList.contains('hide')) resetIdle();
    });
  });

  playNext();
  fmt();
})();
</script>
</body>
</html>
